name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python 3.12 tests and lint baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile tracked Python source
        run: git ls-files -z -- '*.py' | xargs -0 python -m py_compile

      - name: Run pytest
        run: python -m pytest -v

      - name: Check all tracked Python files against the reviewed baseline
        run: python scripts/flake8_baseline.py --all-tracked

  safe-javascript:
    name: Safe local JavaScript checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run explicit local-only JavaScript allowlist
        run: npm run test:safe
