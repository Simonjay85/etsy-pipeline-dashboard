# Pre-commit hooks — broad-exception lint enforcement (flake8: E722, B902)
# Existing reviewed findings live in .flake8-baseline.json; new fingerprints fail.
# Install once per clone:  .venv/bin/pre-commit install
repos:
  - repo: local
    hooks:
      - id: flake8-broad-except
        name: flake8 check (E722/B902)
        entry: .venv/bin/python scripts/flake8_baseline.py --baseline .flake8-baseline.json
        language: system
        types: [python]
        require_serial: true
