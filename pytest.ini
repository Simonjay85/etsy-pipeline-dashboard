[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = scratch .venv venv __pycache__ node_modules .browser-session .playwright-cli .migration-backup* .qoder shops shops_wp master_products output outputs tmp tmp_pdf_preview* ebay_wp_dashboard
markers =
    unit: fast local unit tests
    integration: local integration tests spanning multiple components
    browser: tests that exercise browser automation or browser-like fixtures
    external_contract: tests that validate an external or cross-process contract
